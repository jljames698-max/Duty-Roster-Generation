<script>
/* ============================================================================
   I MSB / I MEF CE Duty SECTION Allocator (single-file, browser only).
   - Counts eligible OOD (SSgt/GySgt/2ndLt/1stLt/Capt/WO1/CWO2-5) and
     AOOD (Cpl/Sgt) watch standers SEPARATELY, by section.
   - Screens "present for duty": excludes ineligible ranks, unmapped units, and
     anyone whose status/absence end-date runs past the target month's end.
   - Apportions duty DAYS to sections proportionally to eligible strength.
       OOD : MSB days (1-15, +31) -> HQ/CSSC by OOD counts; MEF days -> sections.
       AOOD: whole month -> HQ/CSSC by AOOD counts.
   - Overlays weekend/holiday fairness after the proportional math.
   - Allocates SECTIONS only; sections fill their own personnel names.
   ============================================================================ */

const HOLIDAYS=[
  {liberty_starts:"2025-12-31T16:30:00",liberty_ends:"2026-01-05T07:30:00",label:"NEW YEARS 96"},
  {liberty_starts:"2026-01-15T16:30:00",liberty_ends:"2026-01-20T07:30:00",label:"MLK DAY 96"},
  {liberty_starts:"2026-02-12T16:30:00",liberty_ends:"2026-02-17T07:30:00",label:"PRESIDENTS DAY 96"},
  {liberty_starts:"2026-05-21T16:30:00",liberty_ends:"2026-05-26T07:30:00",label:"MEMORIAL DAY 96"},
  {liberty_starts:"2026-06-18T16:30:00",liberty_ends:"2026-06-23T07:30:00",label:"JUNETEENTH 96"},
  {liberty_starts:"2026-07-02T16:30:00",liberty_ends:"2026-07-07T07:30:00",label:"INDEPENDENCE DAY 96"},
  {liberty_starts:"2026-09-03T16:30:00",liberty_ends:"2026-09-08T07:30:00",label:"LABOR DAY 96"},
  {liberty_starts:"2026-10-08T16:30:00",liberty_ends:"2026-10-13T07:30:00",label:"COLUMBUS DAY 96"},
  {liberty_starts:"2026-11-09T16:30:00",liberty_ends:"2026-11-13T07:30:00",label:"VETERANS DAY 72"},
  {liberty_starts:"2026-11-25T16:30:00",liberty_ends:"2026-11-30T07:30:00",label:"THANKSGIVING 96"},
  {liberty_starts:"2026-12-23T16:30:00",liberty_ends:"2026-12-28T07:30:00",label:"CHRISTMAS 96"},
  {liberty_starts:"2026-12-30T16:30:00",liberty_ends:"2027-01-04T07:30:00",label:"NEW YEARS 96"}
];
const MEF_ALL=["G1","G2","G3","G4","G5","G6","G7","G8","CMST","SSEC"]; // G5/SSEC off by default
function activeMef(){ return MEF_ALL.filter(s=>state.target.active && state.target.active[s]); }
function allSections(){ return ["HQ","CSSC"].concat(activeMef()); }
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* Seed history (section allocations) so the fairness overlay works day one. */
const SEED_HISTORY=[
 {month:1,year:2026,label:"January 2026",days:[
  {date:14,day:"Wed",oodSection:"G4",holiday:""},{date:15,day:"Thu",oodSection:"G4",holiday:""},{date:16,day:"Fri",oodSection:"G3",holiday:"MLK DAY 96"},
  {date:17,day:"Sat",oodSection:"G2",holiday:""},{date:18,day:"Sun",oodSection:"CSSC",holiday:""},{date:19,day:"Mon",oodSection:"HQ",holiday:"MLK DAY 96"},
  {date:20,day:"Tue",oodSection:"HQ",holiday:""},{date:21,day:"Wed",oodSection:"G6",holiday:""},{date:22,day:"Thu",oodSection:"HQ",holiday:""},
  {date:23,day:"Fri",oodSection:"G1",holiday:""},{date:24,day:"Sat",oodSection:"G1",holiday:""},{date:25,day:"Sun",oodSection:"CMST",holiday:""},
  {date:26,day:"Mon",oodSection:"HQ",holiday:""},{date:27,day:"Tue",oodSection:"CSSC",holiday:""},{date:28,day:"Wed",oodSection:"G2",holiday:""},
  {date:29,day:"Thu",oodSection:"G6",holiday:""},{date:30,day:"Fri",oodSection:"G8",holiday:""},{date:31,day:"Sat",oodSection:"G3",holiday:""}]},
 {month:2,year:2026,label:"February 2026",days:[
  {date:13,day:"Fri",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:14,day:"Sat",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:15,day:"Sun",oodSection:"G3",holiday:"PRESIDENTS DAY 96"},
  {date:16,day:"Mon",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:17,day:"Tue",oodSection:"HQ",holiday:""},{date:18,day:"Wed",oodSection:"G4",holiday:""},
  {date:19,day:"Thu",oodSection:"G6",holiday:""},{date:20,day:"Fri",oodSection:"HQ",holiday:""},{date:21,day:"Sat",oodSection:"G1",holiday:""},
  {date:22,day:"Sun",oodSection:"G4",holiday:""},{date:23,day:"Mon",oodSection:"CMST",holiday:""},{date:24,day:"Tue",oodSection:"G1",holiday:""},
  {date:25,day:"Wed",oodSection:"G2",holiday:""},{date:26,day:"Thu",oodSection:"G6",holiday:""},{date:27,day:"Fri",oodSection:"G8",holiday:""},{date:28,day:"Sat",oodSection:"G3",holiday:""}]},
 {month:3,year:2026,label:"March 2026",days:[
  {date:17,day:"Tue",oodSection:"G1",holiday:""},{date:18,day:"Wed",oodSection:"G3",holiday:""},{date:19,day:"Thu",oodSection:"G2",holiday:""},
  {date:20,day:"Fri",oodSection:"G4",holiday:""},{date:21,day:"Sat",oodSection:"G2",holiday:""},{date:22,day:"Sun",oodSection:"G4",holiday:""},
  {date:23,day:"Mon",oodSection:"G6",holiday:""},{date:24,day:"Tue",oodSection:"G8",holiday:""},{date:25,day:"Wed",oodSection:"CMST",holiday:""},
  {date:26,day:"Thu",oodSection:"G1",holiday:""},{date:27,day:"Fri",oodSection:"G6",holiday:""},{date:28,day:"Sat",oodSection:"G3",holiday:""},
  {date:29,day:"Sun",oodSection:"G8",holiday:""},{date:30,day:"Mon",oodSection:"HQ",holiday:""},{date:31,day:"Tue",oodSection:"G4",holiday:""}]},
 {month:5,year:2026,label:"May 2026",days:[
  {date:16,day:"Sat",oodSection:"G7",holiday:""},{date:17,day:"Sun",oodSection:"G1",holiday:""},{date:18,day:"Mon",oodSection:"G8",holiday:""},
  {date:19,day:"Tue",oodSection:"G2",holiday:""},{date:20,day:"Wed",oodSection:"G4",holiday:""},{date:21,day:"Thu",oodSection:"CMST",holiday:""},
  {date:22,day:"Fri",oodSection:"G2",holiday:"MEMORIAL DAY 96"},{date:23,day:"Sat",oodSection:"G6",holiday:""},{date:24,day:"Sun",oodSection:"G3",holiday:""},
  {date:25,day:"Mon",oodSection:"CMST",holiday:"MEMORIAL DAY 96"},{date:26,day:"Tue",oodSection:"G4",holiday:""},{date:27,day:"Wed",oodSection:"G6",holiday:""},
  {date:28,day:"Thu",oodSection:"G3",holiday:""},{date:29,day:"Fri",oodSection:"G7",holiday:""},{date:30,day:"Sat",oodSection:"G8",holiday:""}]}
];

/* Default eligible counts {section:{ood,aood}} — illustrative, overwrite/upload each month.
   HQ is OOD-heavy (officers/SNCOs); CSSC is AOOD-heavy (Cpl/Sgt) — per your note. */
const DEFAULT_ELIG={ HQ:{ood:9,aood:3}, CSSC:{ood:4,aood:11},
  G1:{ood:4,aood:0},G2:{ood:19,aood:0},G3:{ood:16,aood:0},G4:{ood:25,aood:0},G5:{ood:0,aood:0},
  G6:{ood:10,aood:0},G7:{ood:73,aood:0},G8:{ood:10,aood:0},CMST:{ood:8,aood:0},SSEC:{ood:0,aood:0} };

/* ---- CALENDAR -------------------------------------------------------------- */
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function parseLocal(s){ const [d,t='00:00:00']=s.split('T'); const [Y,M,D]=d.split('-').map(Number); const [h,mi,se]=t.split(':').map(Number); return new Date(Y,M-1,D,h||0,mi||0,se||0); }
function holidayLabelFor(y,m,date){ const s=new Date(y,m-1,date,0,0,0), e=new Date(y,m-1,date,23,59,59);
  for(const h of HOLIDAYS){ if(s<=parseLocal(h.liberty_ends)&&e>=parseLocal(h.liberty_starts)) return h.label; } return ''; }
function buildCalendar(y,m,mefCeStart){ const n=daysInMonth(y,m), days=[];
  for(let date=1;date<=n;date++){ const dow=new Date(y,m-1,date).getDay(), label=holidayLabelFor(y,m,date);
    days.push({date,dow,day:DAY_NAMES[dow],isWeekend:dow===0||dow===6,holiday:label,isHoliday:!!label}); }
  return {year:y,month:m,monthName:MONTH_NAMES[m-1],label:`${MONTH_NAMES[m-1]} ${y}`,mefCeStart,daysInMonth:n,days}; }
function bucketOf(date,mefCeStart){ if(date===31) return 'MSB'; if(date<mefCeStart) return 'MSB'; if(date<=30) return 'MEF_CE'; return 'MSB'; }

/* ---- FAIRNESS (cross-month weekend/holiday overlay for OOD sections) -------- */
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function blank(){ return {total:0,weekend:0,holiday:0}; }
function dWk(d){ return typeof d.isWeekend==='boolean'?d.isWeekend:(d.day==='Sat'||d.day==='Sun'); }
function dHol(d){ return !!(d.holiday&&String(d.holiday).trim()); }
function summarize(rosters){ const bySection={},byMonth={},ms=new Set();
  const ens=s=>{ if(!bySection[s]) bySection[s]={...blank(),byMonth:{}}; return bySection[s]; };
  for(const r of rosters){ const k=monthKey(r.year,r.month); ms.add(k); byMonth[k]=byMonth[k]||{};
    for(const d of r.days||[]){ const sec=d.oodSection||(d.ood&&d.ood.section); if(!sec) continue; const w=dWk(d),h=dHol(d),s=ens(sec);
      s.total++; if(w)s.weekend++; if(h)s.holiday++; s.byMonth[k]=s.byMonth[k]||blank(); s.byMonth[k].total++; if(w)s.byMonth[k].weekend++; if(h)s.byMonth[k].holiday++;
      byMonth[k][sec]=byMonth[k][sec]||blank(); byMonth[k][sec].total++; if(w)byMonth[k][sec].weekend++; if(h)byMonth[k][sec].holiday++; }}
  return {bySection,byMonth,months:[...ms].sort()}; }
function priorMonthKey(b,y,m){ const t=monthKey(y,m), e=b.months.filter(x=>x<t); return e.length?e[e.length-1]:null; }
function burdenForMonth(b,k,s){ return (b.byMonth[k]&&b.byMonth[k][s])||blank(); }
function recentBurden(b,s,bk,n=4){ const ks=b.months.filter(m=>!bk||m<=bk).slice(-n); let w=0,h=0,t=0;
  ks.forEach((k,i)=>{ const wt=i+1, st=(b.byMonth[k]&&b.byMonth[k][s])||blank(); w+=st.weekend*wt; h+=st.holiday*wt; t+=st.total*wt; }); return {weekend:w,holiday:h,total:t}; }
function scoreSection(section,day,b,target,state2){ const pk=priorMonthKey(b,target.year,target.month), prev=pk?burdenForMonth(b,pk,section):blank(), rec=recentBurden(b,section,pk);
  const special=day.isWeekend||day.isHoliday; let sc=0;
  if(special){ if(day.isHoliday&&prev.holiday>0) sc+=100; if(day.isWeekend&&prev.weekend>0) sc+=60; if(prev.weekend+prev.holiday>0) sc+=25;
    sc+=(state2.assignedWeekend[section]||0)*40; sc+=(state2.assignedHoliday[section]||0)*80; sc+=rec.holiday*6+rec.weekend*3; }
  return sc; }
function rankSections(secs,day,b,target,state2){ return [...secs].map(s=>({section:s,score:scoreSection(s,day,b,target,state2)})).sort((a,b2)=>a.score-b2.score||a.section.localeCompare(b2.section)); }
function gradeRoster(g,b){ const pk=priorMonthKey(b,g.year,g.month),flags=[]; let pen=0; const tm={};
  for(const d of g.days){ const sec=d.ood&&d.ood.section; if(!sec) continue; tm[sec]=tm[sec]||blank(); tm[sec].total++; if(d.isWeekend)tm[sec].weekend++; if(d.isHoliday)tm[sec].holiday++; }
  for(const [sec,st] of Object.entries(tm)){ const prev=pk?burdenForMonth(b,pk,sec):blank();
    if(st.holiday>0&&prev.holiday>0){ pen+=20; flags.push({level:'red',msg:`${sec} carried holiday duty two months in a row.`}); }
    else if(st.weekend>0&&prev.weekend>0){ pen+=10; flags.push({level:'yellow',msg:`${sec} carried weekend duty two months in a row.`}); } }
  const score=Math.max(0,100-pen), grade=score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F'; return {score,grade,flags,thisMonth:tm}; }

/* ---- PROPORTIONAL QUOTAS (largest-remainder) ------------------------------- */
function largestRemainder(weights,total){ const keys=Object.keys(weights); const sum=keys.reduce((a,k)=>a+(weights[k]||0),0); const q={}; keys.forEach(k=>q[k]=0);
  if(total<=0||!keys.length) return q; if(sum<=0){ for(let i=0;i<total;i++) q[keys[i%keys.length]]++; return q; }
  const rem=[]; let used=0; keys.forEach(k=>{ const raw=(weights[k]||0)/sum*total, f=Math.floor(raw); q[k]=f; used+=f; rem.push([k,raw-f]); });
  let left=total-used; rem.sort((a,b)=>b[1]-a[1]); for(let i=0;i<left;i++) q[rem[i%rem.length][0]]++; return q; }

/* G-shop rule: every section gets 2 days; <5 standers -> 1; biggest -> up to 3.
   Then adjust to exactly fill the MEF CE days (add to largest first, remove from
   smallest first). Returns {quota, note} where note flags any forced deviation. */
function allocateMefQuota(secs,oodCount,days){ const q={},cap={},floor={};
  secs.forEach(s=>{ const c=oodCount[s]||0; if(c<=0){q[s]=0;cap[s]=0;floor[s]=0;} else if(c<5){q[s]=1;cap[s]=1;floor[s]=1;} else {q[s]=2;cap[s]=3;floor[s]=1;} });
  const active=secs.filter(s=>cap[s]>0); const byDesc=[...active].sort((a,b)=>(oodCount[b]||0)-(oodCount[a]||0)||a.localeCompare(b)); const byAsc=[...byDesc].reverse();
  let sum=active.reduce((a,s)=>a+q[s],0); let note='', guard=0;
  // add up to cap (largest sections first)
  while(sum<days){ let added=false; for(const s of byDesc){ if(q[s]<cap[s]){ q[s]++; sum++; added=true; if(sum>=days) break; } } if(!added) break; if(++guard>5000) break; }
  if(sum<days){ note='Not enough sections for the 3/section cap — largest exceed 3 to cover all days.'; while(sum<days&&byDesc.length){ q[byDesc[0]]++; sum++; if(++guard>9000) break; } }
  // remove down to floor (smallest sections first)
  while(sum>days){ let removed=false; for(const s of byAsc){ if(q[s]>floor[s]){ q[s]--; sum--; removed=true; if(sum<=days) break; } } if(!removed) break; if(++guard>14000) break; }
  if(sum>days){ note='More sections than duty days — smallest section(s) received 0.'; for(const s of byAsc){ while(q[s]>0&&sum>days){ q[s]--; sum--; } } }
  return {quota:q,note}; }

/* ---- ALLOCATION ENGINE ----------------------------------------------------- */
function allocateBucketDays(bucketDays,sections,quota,burden,target){ const cap={}; sections.forEach(s=>cap[s]=quota[s]||0);
  const st={assignedWeekend:{},assignedHoliday:{}}; const ordered=[...bucketDays].sort((a,b)=>{ const r=x=>x.isHoliday?0:x.isWeekend?1:2; return r(a)-r(b)||a.date-b.date; }); const out={};
  for(const day of ordered){ const avail=sections.filter(s=>cap[s]>0); if(!avail.length){ out[day.date]=''; continue; }
    const sec=rankSections(avail,day,burden,target,st)[0].section; out[day.date]=sec; cap[sec]--;
    if(day.isWeekend)st.assignedWeekend[sec]=(st.assignedWeekend[sec]||0)+1; if(day.isHoliday)st.assignedHoliday[sec]=(st.assignedHoliday[sec]||0)+1; } return out; }

/* AOOD: HQ vs CSSC across the whole month, proportional to AOOD counts, with
   in-month weekend/holiday balance so neither company hogs the special days. */
function allocateAood(allDays,quota){ const cap={HQ:quota.HQ||0,CSSC:quota.CSSC||0}, sp={HQ:0,CSSC:0}, tot={HQ:0,CSSC:0}, out={};
  const ordered=[...allDays].sort((a,b)=>{ const r=x=>x.isHoliday?0:x.isWeekend?1:2; return r(a)-r(b)||a.date-b.date; });
  for(const day of ordered){ const avail=['HQ','CSSC'].filter(s=>cap[s]>0); if(!avail.length){ out[day.date]=''; continue; }
    const special=day.isWeekend||day.isHoliday;
    avail.sort((a,b)=> special ? (sp[a]-sp[b]||tot[a]-tot[b]||a.localeCompare(b)) : (tot[a]-tot[b]||sp[a]-sp[b]||a.localeCompare(b)));
    const s=avail[0]; out[day.date]=s; cap[s]--; tot[s]++; if(special)sp[s]++; } return out; }

function allocateRoster(cal,elig,cfg,burden){ const mefCeStart=cfg.mefCeStart; const msbDays=[],mefDays=[];
  cal.days.forEach(d=> (bucketOf(d.date,mefCeStart)==='MSB'?msbDays:mefDays).push(d));
  const E=(s,r)=> (elig[s]&&elig[s][r])||0;
  // OOD — MSB
  const msbOodW={HQ:E('HQ','ood'),CSSC:E('CSSC','ood')}; const msbOodQ=largestRemainder(msbOodW,msbDays.length);
  // OOD — MEF CE (active sections only; 2/section rule, 1 if <5, up to 3 for biggest)
  const active=cfg.active||{}; const mefPool=MEF_ALL.filter(s=>active[s]&&E(s,'ood')>0);
  const mefOodW={}; MEF_ALL.forEach(s=>mefOodW[s]=E(s,'ood'));
  const mefRes=allocateMefQuota(mefPool,mefOodW,mefDays.length); const mefOodQ=mefRes.quota;
  // AOOD — HQ/CSSC whole month
  const aoodW={HQ:E('HQ','aood'),CSSC:E('CSSC','aood')}; const aoodQ=largestRemainder(aoodW,cal.days.length);
  const target={year:cal.year,month:cal.month};
  const msbAssign=allocateBucketDays(msbDays,['HQ','CSSC'].filter(s=>msbOodQ[s]>0||msbOodW[s]>0),msbOodQ,burden,target);
  const mefActive=mefPool.filter(s=>mefOodQ[s]>0); const mefAssign=allocateBucketDays(mefDays,mefActive,mefOodQ,burden,target);
  const aoodAssign=allocateAood(cal.days,aoodQ);
  const days=cal.days.map(d=>{ const isMsb=bucketOf(d.date,mefCeStart)==='MSB';
    return {date:d.date,day:d.day,dow:d.dow,isWeekend:d.isWeekend,isHoliday:d.isHoliday,holiday:d.holiday,pool:isMsb?'MSB':'MEF_CE',
      ood:{name:'',section:(isMsb?msbAssign[d.date]:mefAssign[d.date])||'',phone:''}, aood:{name:'',section:aoodAssign[d.date]||'',phone:''}}; });
  return {year:cal.year,month:cal.month,monthName:cal.monthName,label:cal.label,mefCeStart,days,
    supernumerary:[{element:'HQ'},{element:'CSSC'},{element:'I MEF CE'}],
    quota:{msbDays:msbDays.length,mefDays:mefDays.length,total:cal.days.length,msbOodW,msbOodQ,mefOodW,mefOodQ,aoodW,aoodQ,mefSecs:mefPool,mefNote:mefRes.note}, unassigned:[]}; }

/* ---- MANPOWER PARSING (rank/unit/status/end-date screening) ----------------- */
function classifyRank(raw){ if(!raw) return null; const s=String(raw).toUpperCase().replace(/[.\s_]/g,'');
  const pg=s.match(/^([EOW])-?(\d)/); if(pg){ const t=pg[1], n=+pg[2];
    if(t==='E'){ if(n===4||n===5) return 'AOOD'; if(n===6||n===7) return 'OOD'; return null; }
    if(t==='O'){ return (n>=1&&n<=3)?'OOD':null; } if(t==='W'){ return (n>=1&&n<=3)?'OOD':null; } } // W1-W3 only (no CWO4/CWO5)
  if(/CAPT|CAPTAIN/.test(s)) return 'OOD';
  if(/1STLT|1LT|FIRSTLIEUT/.test(s)) return 'OOD';
  if(/2NDLT|2LT|SECONDLIEUT/.test(s)) return 'OOD';
  if(/CWO|WARRANT|^WO\d?$|^W\d$/.test(s)){ const num=(s.match(/[0-9]/)||[])[0]; if(num&&+num>=4) return null; return 'OOD'; } // WO1/CWO2/CWO3 only
  if(/GYSGT|GUNNERY/.test(s)) return 'OOD';
  if(/SSGT|STAFFSGT|STAFFSERG/.test(s)) return 'OOD';
  if(/MGYSGT|MASTERGUNNERY|SGTMAJ|SERGEANTMAJ|1STSGT|FIRSTSGT|MSGT|MASTERSGT/.test(s)) return null; // senior SNCOs not eligible
  if(/LCPL|LANCECPL|LANCECORPORAL/.test(s)) return null; // Lance Corporal not eligible
  if(/^SGT|SERGEANT/.test(s)) return 'AOOD';
  if(/CPL|CORPORAL/.test(s)) return 'AOOD';
  return null; }
function mapUnit(raw){ if(!raw) return null; const s=String(raw).toUpperCase().replace(/\s/g,'');
  if(s.includes('20141')){ const rest=s.replace(/20141/g,''); if(/H/.test(rest)) return 'HQ'; if(/S/.test(rest)) return 'CSSC'; return null; }
  const g=s.match(/20371\D*([1-8])/); if(g) return 'G'+g[1];
  if(s.includes('CMST')||s.includes('COMMSTRAT')) return 'CMST';
  if(s.includes('SSEC')) return 'SSEC';
  if(/^(HQ|CSSC|G[1-8]|CMST|SSEC)$/.test(s)) return s;
  if(s.includes('HEADQUART')) return 'HQ'; if(s.includes('COMBATSERVICE')) return 'CSSC';
  return null; }
function statusPresent(raw){ if(!raw) return true; const s=String(raw).toLowerCase();
  if(/leave|tad|tdy|deploy|ua\b|awol|legal|conf|brig|medical|hospital|wounded|wia|school|pcs|pca|transient|maternit|convales|annual|terminal|appt|nmps|fap/.test(s)) return false;
  if(/limited|light/.test(s)) return false; return true; }
function toDate(v){ if(v==null) return null; if(v instanceof Date) return isNaN(v)?null:v; const s=String(v).replace(/[\t\s]+/g,' ').trim(); if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function splitCsvLine(l){ const out=[]; let cur='',q=false; for(let i=0;i<l.length;i++){ const ch=l[i];
  if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
  else { if(ch===','){ out.push(cur); cur=''; } else if(ch==='"') q=true; else cur+=ch; } } out.push(cur); return out; }
async function readManpowerRows(file){ const name=file.name.toLowerCase();
  if(name.endsWith('.csv')){ const text=await file.text(); const lines=text.split(/\r?\n/).filter(l=>l.trim());
    return {headers:splitCsvLine(lines[0]).map(h=>h.trim()), rows:lines.slice(1).map(splitCsvLine)}; }
  if(typeof ExcelJS==='undefined') throw new Error('Excel reader not loaded on this network — upload a .csv or type counts.');
  const buf=await file.arrayBuffer(); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf); const ws=wb.worksheets[0];
  const all=[]; ws.eachRow({includeEmpty:false},row=>{ const arr=[]; row.eachCell({includeEmpty:true},(c,i)=>{ arr[i-1]=c.value; }); all.push(arr); });
  const txt=v=>String(v==null?'':(v.text||v.result||v)).toLowerCase();
  let hi=0; for(let i=0;i<Math.min(all.length,15);i++){ const t=all[i].map(txt); if(t.some(x=>/rank|grade/.test(x))&&t.some(x=>/unit|ruc|mcc|uic|section|cmd/.test(x))){ hi=i; break; } }
  return {headers:all[hi].map(v=>String(v==null?'':(v.text||v.result||v)).trim()), rows:all.slice(hi+1)}; }
function findCol(headers,re){ return headers.findIndex(h=>re.test(String(h).toLowerCase())); }
async function parseManpower(file){ const {headers,rows}=await readManpowerRows(file);
  const ci={ rank:findCol(headers,/rank|grade|^pay/), unit:findCol(headers,/unit|ruc|mcc|uic|cmd/),
    category:findCol(headers,/category/), status:findCol(headers,/duty ?status|^status$|status/),
    end:findCol(headers,/end ?date|return|rtd|thru|date ?back/), name:findCol(headers,/name/) };
  if(ci.rank<0||ci.unit<0) throw new Error('Could not find Rank and Unit columns. Check the file headers, or type counts manually.');
  const counts={}; allSections().forEach(s=>counts[s]={ood:0,aood:0}); const seen=new Set();
  const monthEnd=new Date(state.target.year,state.target.month,0);
  const cutoff=new Date(state.target.year,state.target.month-1,monthEnd.getDate()-4); // returns with >=5 days left
  const txt=v=> v==null?'':String(v.text||v.result||v).trim();
  let included=0; const reasons={}; const excluded=[];
  const note=(name,reason)=>{ reasons[reason]=(reasons[reason]||0)+1; if(excluded.length<120) excluded.push({name,reason}); };
  for(const r of rows){ const rankS=txt(r[ci.rank]); if(!rankS) continue;
    const nm=ci.name>=0?txt(r[ci.name]):rankS;
    const role=classifyRank(rankS); if(!role){ note(nm,'rank not OOD/AOOD'); continue; }
    const section=mapUnit(txt(r[ci.unit])); if(!section){ note(nm,'unit not mapped'); continue; }
    seen.add(section);
    const cat=ci.category>=0?txt(r[ci.category]):''; const statusS=ci.status>=0?txt(r[ci.status]):''; const end=ci.end>=0?toDate(r[ci.end]):null;
    const onHand = cat ? /on.?hand/i.test(cat) : statusPresent(statusS);
    let present;
    if(onHand){ present=true; } // present for duty at the unit this month
    else { present = !!(end && end<=cutoff); } // absent: counts only if back with >=5 days left
    if(!present){ note(nm, (end&&end>monthEnd)?'absent past end of month':'not present for duty'); continue; }
    if(!counts[section]) counts[section]={ood:0,aood:0}; counts[section][role.toLowerCase()]++; included++; }
  return {counts,included,reasons,excluded,seen:[...seen],headers}; }
async function uploadManpower(input){ const f=input.files[0]; if(!f) return;
  try{ const res=await parseManpower(f);
    res.seen.forEach(sec=>{ state.elig[sec]=res.counts[sec]||{ood:0,aood:0}; // merge: only update sections present in this file
      if(MEF_ALL.includes(sec)&&res.counts[sec]&&res.counts[sec].ood>0){ state.target.active=state.target.active||{}; state.target.active[sec]=true; } });
    state.screen={file:f.name,included:res.included,reasons:res.reasons,excluded:res.excluded,sections:res.seen,when:new Date().toISOString()};
    persist(); render(); toast(`Screened ${res.included} eligible from ${f.name} (${res.seen.join(', ')}). Review counts below.`);
  }catch(e){ toast('Manpower parse failed: '+e.message); } input.value=''; }

/* ---- EXCEL / CSV EXPORT ---------------------------------------------------- */
const HEADERS=['DATE','DAY','OOD','SECTION','OOD#','AOOD','SECTION','AOOD#','Holiday']; const COLW=[6,12,32,10,16,32,10,16,18];
async function exportXlsx(roster){ if(typeof ExcelJS==='undefined'){ toast('Excel library not loaded — exporting CSV.'); return exportCsv(roster); }
  const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet(`${roster.monthName} ${roster.year}`,{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=COLW.map(w=>({width:w})); const bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  const stl=(row,font,fill)=>row.eachCell({includeEmpty:true},c=>{ c.font=font||{name:'Calibri',size:8,bold:true}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=bd; if(fill)c.fill=fill; });
  ws.mergeCells(1,1,1,HEADERS.length); const t=ws.getCell(1,1);
  t.value=`MEF & MSB Duty Roster for ${roster.monthName} ${roster.year}. P.O.C for NO SHOWS is the HQ Co 1stLt Joseph, James`;
  t.font={name:'Calibri',size:11,bold:true}; t.alignment={horizontal:'center',vertical:'middle',wrapText:true}; t.border=bd; ws.getRow(1).height=30;
  const hr=ws.getRow(2); HEADERS.forEach((h,i)=>hr.getCell(i+1).value=h); stl(hr,{name:'Calibri',size:10,bold:true});
  const yel={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}},amb={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC000'}},blk={type:'pattern',pattern:'solid',fgColor:{argb:'FF000000'}};
  let r=3; for(const d of roster.days){ const row=ws.getRow(r); row.getCell(1).value=d.date; row.getCell(2).value=d.day;
    row.getCell(4).value=(d.ood&&d.ood.section)||''; row.getCell(7).value=(d.aood&&d.aood.section)||''; row.getCell(9).value=d.holiday||'';
    stl(row,null,d.isHoliday?amb:d.isWeekend?yel:null); r++; }
  const sf={name:'Calibri',size:8,bold:true,color:{argb:'FFFFFFFF'}};
  for(const s of roster.supernumerary||[]){ const row=ws.getRow(r); row.getCell(1).value=s.element; row.getCell(2).value='SUPERNUMERARY'; stl(row,sf,blk); r++; }
  const tr=ws.getRow(r); tr.getCell(1).value='TOTAL'; tr.getCell(2).value=`${roster.days.length} days`; stl(tr);
  const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`${roster.monthName}_${roster.year}_OOD_AOOD_Duty_Roster.xlsx`); toast('Excel file downloaded.'); }
function exportCsv(roster){ const q=v=>{ v=v==null?'':String(v); return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  let rows=[HEADERS.join(',')]; for(const d of roster.days) rows.push([d.date,d.day,'',d.ood&&d.ood.section,'','',d.aood&&d.aood.section,'',q(d.holiday)].join(','));
  for(const s of roster.supernumerary||[]) rows.push([s.element,'SUPERNUMERARY','','','','','','',''].join(','));
  download(new Blob([rows.join('\n')],{type:'text/csv'}),`${roster.monthName}_${roster.year}_OOD_AOOD_Duty_Roster.csv`); toast('CSV downloaded.'); }

/* ---- PARSE PRIOR ROSTER (.xlsx) for history -------------------------------- */
function normalizeSection(s){ if(!s) return ''; const u=String(s).trim().toUpperCase(); return ({'COMMSTRAT':'CMST','CMST/COMMSTRAT':'CMST'})[u]||u; }
function monthYearFromName(name){ const l=name.toLowerCase(); let month=null; MONTH_NAMES.forEach((m,i)=>{ if(l.includes(m.toLowerCase())) month=i+1; }); const y=l.match(/(20\d{2})/); return {month,year:y?Number(y[1]):null}; }
function cellText(c){ if(!c) return ''; const v=c.value; if(v==null) return ''; if(typeof v==='object'){ if(v.text) return String(v.text).trim(); if(v.result!=null) return String(v.result).trim(); if(v.richText) return v.richText.map(t=>t.text).join('').trim(); return ''; } return String(v).trim(); }
async function parseRosterFile(file){ if(typeof ExcelJS==='undefined') throw new Error('Excel reader unavailable.');
  const buf=await file.arrayBuffer(), wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf); const ws=wb.worksheets[0]; let hr=2;
  ws.eachRow((row,n)=>{ const vals=row.values.map(c=>String(c||'').toUpperCase()); if(vals.some(v=>v.includes('DATE'))&&vals.some(v=>v.includes('OOD'))&&hr===2) hr=n; });
  const col={}; ws.getRow(hr).eachCell((c,i)=>{ const tt=cellText(c).toUpperCase().replace(/\s+/g,'');
    if(tt==='DATE')col.date=i; else if(tt==='DAY')col.day=i; else if(tt.includes('HOLIDAY'))col.holiday=i;
    else if(tt==='AOOD'&&col.aood==null)col.aood=i; else if(tt==='OOD'&&col.ood==null)col.ood=i;
    else if(tt==='SECTION'){ if(col.oodSection==null)col.oodSection=i; else col.aoodSection=i; } });
  const at=(row,c)=>c?cellText(row.getCell(c)):''; const {month,year}=monthYearFromName(file.name); const days=[];
  for(let r=hr+1;r<=ws.rowCount;r++){ const row=ws.getRow(r), draw=at(row,col.date||1), date=parseInt(draw,10), oodSection=normalizeSection(at(row,col.oodSection));
    if(/SUPERNUMERARY|TOTAL/i.test(draw)||/SUPERNUMERARY/i.test(oodSection)) continue; if(!Number.isFinite(date)) continue;
    days.push({date,day:at(row,col.day),oodSection,holiday:at(row,col.holiday)}); }
  return {month,year,label:(month&&year)?`${MONTH_NAMES[month-1]} ${year}`:file.name,days}; }

  if(!state.elig||!state.elig.HQ||typeof state.elig.HQ!=='object') state.elig=JSON.parse(JSON.stringify(DEFAULT_ELIG));
  if(!state.history) state.history=JSON.parse(JSON.stringify(SEED_HISTORY));
  if(!state.target.active){ state.target.active={}; MEF_ALL.forEach(s=>state.target.active[s]=!(s==='G5'||s==='SSEC'));
    if(state.target.includeSSEC) state.target.active.SSEC=true; } }
function persist(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({elig:state.elig,history:state.history,target:state.target})); }catch(e){} }
function saveDataFile(){ const data={app:'imsb-section-allocator',version:3,exported:new Date().toISOString(),elig:state.elig,history:state.history,target:state.target};
  download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'duty_allocation_data.json'); toast('Data saved — keep this file to move between computers.'); }

function download(blob,name){ const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',4500); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function getElig(s,r){ return (state.elig[s]&&state.elig[s][r])||0; }
function setElig(s,r,v){ state.elig[s]=state.elig[s]||{ood:0,aood:0}; state.elig[s][r]=Math.max(0,parseInt(v,10)||0); persist(); }

  document.getElementById('selMonth').onchange=ev=>{ state.target.month=+ev.target.value; persist(); render(); };
  document.getElementById('selYear').onchange=ev=>{ state.target.year=+ev.target.value; persist(); render(); };
  document.getElementById('selStart').onchange=ev=>{ state.target.mefCeStart=+ev.target.value; persist(); render(); };
}
function toggleActive(s,on){ state.target.active=state.target.active||{}; state.target.active[s]=on; persist(); render(); }
function showExcluded(){ if(!state.screen||!state.screen.excluded) return; const lines=state.screen.excluded.map(x=>`${x.name} — ${x.reason}`).join('\n');
  alert('Excluded from eligible counts:\n\n'+(lines||'(none)')); }
function doAllocate(){ const t=state.target, cal=buildCalendar(t.year,t.month,t.mefCeStart), burden=summarize(state.history);
  state.roster=allocateRoster(cal,state.elig,{mefCeStart:t.mefCeStart,active:t.active},burden);
  state.fairness=gradeRoster(state.roster,burden); render(); toast('Allocation generated. Review, adjust, and export below.'); }

function renderQuotaCard(){ const q=state.roster.quota; const pct=(n,sum)=>sum>0?Math.round(n/sum*100):0;
  const msbSum=(q.msbOodW.HQ||0)+(q.msbOodW.CSSC||0), mefSum=q.mefSecs.reduce((a,s)=>a+(q.mefOodW[s]||0),0), aoodSum=(q.aoodW.HQ||0)+(q.aoodW.CSSC||0);
  const tr=(s,w,sum,quota)=>`<tr><td><b>${s}</b></td><td style="text-align:center;">${w||0}</td><td style="text-align:center;" class="pct">${pct(w||0,sum)}%</td><td style="text-align:center;"><b>${quota||0}</b></td></tr>`;
  const msbRows=['HQ','CSSC'].map(s=>tr(s,q.msbOodW[s],msbSum,q.msbOodQ[s])).join('');
  const tr2=(s,w,quota)=>`<tr><td><b>${s}</b></td><td style="text-align:center;">${w||0}</td><td style="text-align:center;"><b>${quota||0}</b></td></tr>`;
  const mefRows=q.mefSecs.map(s=>tr2(s,q.mefOodW[s],q.mefOodQ[s])).join('');
  const aoodRows=['HQ','CSSC'].map(s=>tr(s,q.aoodW[s],aoodSum,q.aoodQ[s])).join('');
  return `<div class="card"><h2>Apportionment</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;">
      <div><h3>OOD · MSB — ${q.msbDays} days</h3><table><thead><tr><th>Sec</th><th>Elig</th><th>Share</th><th>Days</th></tr></thead><tbody>${msbRows}</tbody></table>
        <div class="small muted" style="margin-top:6px;">HQ/CSSC proportional to OOD strength.</div></div>
      <div><h3>OOD · MEF CE — ${q.mefDays} days</h3><table><thead><tr><th>Sec</th><th>Elig</th><th>Days</th></tr></thead><tbody>${mefRows}</tbody></table>
        <div class="small muted" style="margin-top:6px;">2/section · 1 if &lt;5 standers · up to 3 for the largest.${q.mefNote?` <span class="tag-yellow">${esc(q.mefNote)}</span>`:''}</div></div>
      <div><h3>AOOD · all ${q.total} days</h3><table><thead><tr><th>Sec</th><th>Elig</th><th>Share</th><th>Days</th></tr></thead><tbody>${aoodRows}</tbody></table>
        <div class="small muted" style="margin-top:6px;">HQ/CSSC proportional to AOOD strength.</div></div>
    </div></div>`; }
function renderRosterBlock(){ const f=state.fairness, r=state.roster, gc='g'+f.grade, bc=f.score>=80?'#22c55e':f.score>=60?'#eab308':'#ef4444';
  const flags=f.flags.length?f.flags.map(x=>`<li>${x.level==='red'?'🔴':'🟡'} ${esc(x.msg)}</li>`).join(''):'<li style="color:#4ade80;">✅ No weekend/holiday repeats from last month.</li>';
  const msbOpt=v=>`<option value="">—</option>`+['HQ','CSSC'].map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('');
  const allSecs=allSections(); const oodOpt=v=>`<option value="">—</option>`+allSecs.map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('');
  const rows=r.days.map(d=>{ const cls=d.isHoliday?'row-holiday':d.isWeekend?'row-weekend':'';
    return `<tr class="${cls}"><td><b>${d.date}</b></td><td>${d.day}</td>
      <td><select class="cellsel" onchange="swapSec(${d.date},'ood',this.value)">${oodOpt(d.ood.section)}</select></td>
      <td><select class="cellsel" onchange="swapSec(${d.date},'aood',this.value)">${msbOpt(d.aood.section)}</select></td>
      <td class="small" style="color:#fb923c;font-weight:700;">${esc(d.holiday)}</td></tr>`; }).join('');
  const supers=(r.supernumerary||[]).map(s=>`<tr class="row-super"><td colspan="2"><b>${esc(s.element)} — SUPERNUMERARY</b></td><td colspan="3"></td></tr>`).join('');
  return `<div class="card"><div class="flex-between"><h2>${esc(r.label)} — Section Schedule</h2>
      <div class="row no-print">
        <button class="btn btn-primary" onclick="exportXlsx(state.roster)">⬇ Export Excel</button>
        <button class="btn btn-ghost" onclick="exportCsv(state.roster)">CSV</button>
        <button class="btn btn-ghost" onclick="saveToHistory()">Save to History</button>
        <button class="btn btn-ghost" onclick="window.print()">Print</button></div></div>
    <div class="grid grid-2">
      <div><div class="card" style="margin:0 0 12px;">
        <div class="flex-between"><h3>Weekend / Holiday Fairness</h3><div class="grade ${gc}">${f.grade} <span class="muted" style="font-size:16px;">(${f.score})</span></div></div>
        <div class="bar2"><div style="width:${f.score}%;background:${bc};"></div></div>
        <ul class="small" style="margin:6px 0 0;padding-left:16px;">${flags}</ul></div>
        <div class="small muted">Names are intentionally blank — each section fills its own watch standers. Click a SECTION cell to override. Yellow = weekend, amber = holiday.</div></div>
      <div style="overflow-x:auto;"><table><thead><tr><th>DATE</th><th>DAY</th><th>OOD SECTION</th><th>AOOD SECTION</th><th>HOLIDAY</th></tr></thead><tbody>${rows}${supers}</tbody></table></div>
    </div></div>`; }
function swapSec(date,role,val){ const d=state.roster.days.find(x=>x.date===date); if(!d) return; d[role]={name:'',section:val,phone:''};
  state.fairness=gradeRoster(state.roster,summarize(state.history)); render(); }
function saveToHistory(){ const r=state.roster, summary={month:r.month,year:r.year,label:r.label,mefCeStart:r.mefCeStart,
    days:r.days.map(d=>({date:d.date,day:d.day,oodSection:d.ood.section||'',aoodSection:d.aood.section||'',holiday:d.holiday||'',isWeekend:d.isWeekend}))};
  const i=state.history.findIndex(h=>h.year===r.year&&h.month===r.month); if(i>=0) state.history[i]=summary; else state.history.push(summary);
  persist(); toast('Saved to history — next month balances weekends/holidays against this one.'); }

/* ---- HISTORY TAB ----------------------------------------------------------- */
function renderHistory(){ const burden=summarize(state.history), sections=Object.keys(burden.bySection).sort(), months=burden.months;
  const col=st=>{ const sp=(st&&(st.weekend+st.holiday))||0; if(st&&st.holiday) return 'background:rgba(239,68,68,.35);'; if(sp>=2) return 'background:rgba(249,115,22,.35);'; if(sp===1) return 'background:rgba(234,179,8,.3);'; return ''; };
  const bt=months.length?`<div style="overflow-x:auto;"><table><thead><tr><th>Section</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>Σ Wknd</th><th>Σ Hol</th></tr></thead><tbody>`+
    sections.map(sec=>{ const tot=burden.bySection[sec]; return `<tr><td><b>${esc(sec)}</b></td>`+months.map(m=>{ const st=burden.byMonth[m]&&burden.byMonth[m][sec];
      return `<td style="text-align:center;${col(st)}">${st?st.total:'·'}${st&&(st.weekend||st.holiday)?`<div style="font-size:10px;">${st.weekend?st.weekend+'w':''}${st.holiday?' '+st.holiday+'h':''}</div>`:''}</td>`; }).join('')+
      `<td style="text-align:center;"><b>${tot.weekend}</b></td><td style="text-align:center;"><b>${tot.holiday}</b></td></tr>`; }).join('')+
    `</tbody></table></div><div class="small muted" style="margin-top:6px;">Cell = total duty days; <b>w</b>=weekend, <b>h</b>=holiday.</div>`:'<div class="muted">No history yet.</div>';
  const list=[...state.history].sort((a,b)=>(b.year-a.year)||(b.month-a.month)).map(r=>`<tr><td>${esc(r.label||(r.year+'-'+r.month))}</td><td style="text-align:center;">${(r.days||[]).length}</td>
    <td style="text-align:center;"><button class="btn btn-ghost small" style="padding:2px 8px;" onclick="delHistory(${r.year},${r.month})">Remove</button></td></tr>`).join('');
  document.getElementById('tab-history').innerHTML=`
    <div class="card"><h2>Historical Roster Import</h2>
      <div class="small muted" style="margin-bottom:8px;">Upload prior <b>.xlsx</b> rosters (parsed in your browser) so the fairness overlay knows who carried weekends/holidays. Filenames like <i>May_2026_OOD_AOOD_Duty_Roster.xlsx</i> work best.</div>
      <input type="file" id="histFiles" accept=".xlsx" multiple onchange="uploadHistory(this)"/></div>
    <div class="card"><h2>Weekend / Holiday Burden by OOD Section</h2>${bt}</div>
    <div class="card"><h2>Loaded Months (${state.history.length})</h2>
      <table><thead><tr><th>Month</th><th>Days</th><th></th></tr></thead><tbody>${list}</tbody></table>
      <div class="row" style="margin-top:10px;"><button class="btn btn-ghost" onclick="resetHistory()">Reset to Seed</button></div></div>`; }
async function uploadHistory(input){ const files=[...input.files]; if(!files.length) return; let ok=0,bad=[];
  for(const f of files){ try{ const p=await parseRosterFile(f); if(!p.month||!p.year){ bad.push(f.name+' (no month/year in filename)'); continue; }
    const summary={month:p.month,year:p.year,label:p.label,days:p.days}; const i=state.history.findIndex(h=>h.year===p.year&&h.month===p.month);
    if(i>=0) state.history[i]=summary; else state.history.push(summary); ok++; }catch(e){ bad.push(f.name+' ('+e.message+')'); } }
  persist(); render(); toast(`Parsed ${ok} roster(s).`+(bad.length?` Failed: ${bad.join('; ')}`:'')); input.value=''; }
function delHistory(y,m){ state.history=state.history.filter(h=>!(h.year===y&&h.month===m)); persist(); render(); }
function resetHistory(){ if(confirm('Reset history to seeded months?')){ state.history=JSON.parse(JSON.stringify(SEED_HISTORY)); persist(); render(); } }

/* ---- HELP TAB -------------------------------------------------------------- */
function renderAbout(){ document.getElementById('tab-about').innerHTML=`
  <div class="card"><h2>What this tool does</h2>
    <p>Builds the monthly <b>section allocation</b> — which company/section owns each day's OOD and AOOD — based on <b>on-hand eligible strength</b>, counting OOD and AOOD pools separately. It does <b>not</b> assign individual Marines; each section fills its own watch standers on the exported sheet.</p>
    <ol style="line-height:1.7;">
      <li><b>Upload a manpower roster</b> (.xlsx/.csv) to auto-screen &amp; count, or type the counts.</li>
      <li>Pick the month and click <b>Generate Allocation</b>. The Apportionment card shows the proportional math.</li>
      <li>Adjust any SECTION cell, then Export to Excel or Print.</li>
    </ol></div>
  <div class="card"><h2>Eligibility &amp; screening</h2>
    <ul style="line-height:1.7;">
      <li><b>OOD ranks:</b> SSgt, GySgt, 2ndLt, 1stLt, Capt, WO1, CWO2, CWO3. (Pay grades E6–E7, O1–O3, W1–W3.) CWO4/CWO5 and senior SNCOs (MSgt+) are <b>not</b> eligible.</li>
      <li><b>AOOD ranks:</b> Cpl, Sgt (E4–E5) — sourced from HQ/CSSC only.</li>
      <li><b>Present for duty:</b> uses the <b>Category</b> column — <i>On Hand</i> counts (including short Range/Field details). TAD, Leave, Legal, Medical, Other are absences.</li>
      <li><b>Return / end-date rule:</b> a Marine on an absence is counted only if they return with <b>≥5 days left in the month</b>; anyone whose absence runs past the end of the month is not counted.</li>
      <li><b>Unit → section:</b> 20141-H… → HQ, 20141-S… → CSSC, 20371-1…8 → G1…G8, CMST and SSEC as listed. (The <i>EDD</i> column is ignored — only Duty Status + Start/End Date drive screening.)</li>
    </ul>
    <p class="small muted">Columns auto-detected: Rank, Unit, Category, Duty Status, End Date, Name. Upload your MSB file (fills HQ/CSSC) and your MEF CE file (fills the G-shops) — each upload only updates the sections it contains. Verify the counts and override any cell, then allocate.</p></div>
  <div class="card"><h2>Allocation method (per the Bn Duty Order)</h2>
    <ul style="line-height:1.7;">
      <li>MSB owns days 1–15 (and the 31st on long months); MEF CE owns 16–30.</li>
      <li><b>OOD · MSB:</b> MSB days split between HQ and CSSC proportional to OOD strength.</li>
      <li><b>OOD · MEF CE (G-shop rule):</b> each active section gets <b>2</b> days; a section with <b>fewer than 5</b> standers gets <b>1</b>; the <b>largest sections</b> (e.g. G-4, G-7, sometimes G-2) absorb the remaining days up to a cap of <b>3</b>. Toggle a section off (e.g. G-7 on exercise) to drop it from the month — its days redistribute to the others.</li>
      <li><b>AOOD:</b> whole month split between HQ and CSSC proportional to AOOD strength.</li>
      <li>Weekend/holiday fairness overlaid afterward so no section repeats special duty month-to-month when avoidable.</li>
    </ul>
    <div class="small muted">POC: 1stLt Joseph, James L. — HQ Co XO / S-6, I MSB.</div></div>`; }

/* ---- MAIN ------------------------------------------------------------------ */
function render(){ renderNav(); for(const [id] of TABS) document.getElementById('tab-'+id).classList.add('hide');
  document.getElementById('tab-'+state.tab).classList.remove('hide');
  if(state.tab==='generate') renderGenerate(); else if(state.tab==='history') renderHistory(); else renderAbout(); }
loadState(); render();
</script>
</body>
</html>
