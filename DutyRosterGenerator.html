<script>
/* ============================================================================
   I MSB / I MEF CE Duty SECTION Allocator (single-file, runs in the browser).

   What it does (per the signed Bn Duty Order):
   - Apportions duty DAYS to sections based on on-hand eligible strength
     (a Marine present for duty >= 5 days that month). You enter the eligible
     counts; the tool computes proportional quotas (largest-remainder rounding).
   - Structure: MSB owns dates 1..15 (and the 31st on long months); MEF CE owns
     16..30, then MEF CE is subdivided proportionally among its sections.
   - Overlays weekend/holiday fairness AFTER the base math (no section carries
     weekend/holiday duty in back-to-back months when avoidable).
   - It allocates SECTIONS only. Sections fill their own personnel names.
   ============================================================================ */

/* ---- HOLIDAYS (CY26 I MEF special liberty schedule) ------------------------ */
const HOLIDAYS=[
  {liberty_starts:"2025-12-31T16:30:00",liberty_ends:"2026-01-05T07:30:00",label:"NEW YEARS 96"},
  {liberty_starts:"2026-01-15T16:30:00",liberty_ends:"2026-01-20T07:30:00",label:"MLK DAY 96"},
  {liberty_starts:"2026-02-12T16:30:00",liberty_ends:"2026-02-17T07:30:00",label:"PRESIDENTS DAY 96"},
  {liberty_starts:"2026-05-21T16:30:00",liberty_ends:"2026-05-26T07:30:00",label:"MEMORIAL DAY 96"},
  {liberty_starts:"2026-06-18T16:30:00",liberty_ends:"2026-06-23T07:30:00",label:"JUNETEENTH 96"},
  {liberty_starts:"2026-07-02T16:30:00",liberty_ends:"2026-07-07T07:30:00",label:"INDEPENDENCE DAY 96"},
  {liberty_starts:"2026-09-03T16:30:00",liberty_ends:"2026-09-08T07:30:00",label:"LABOR DAY 96"},
  {liberty_starts:"2026-10-08T16:30:00",liberty_ends:"2026-10-13T07:30:00",label:"COLUMBUS DAY 96"},
  {liberty_starts:"2026-11-09T16:30:00",liberty_ends:"2026-11-13T07:30:00",label:"VETERANS DAY 72"},
  {liberty_starts:"2026-11-25T16:30:00",liberty_ends:"2026-11-30T07:30:00",label:"THANKSGIVING 96"},
  {liberty_starts:"2026-12-23T16:30:00",liberty_ends:"2026-12-28T07:30:00",label:"CHRISTMAS 96"},
  {liberty_starts:"2026-12-30T16:30:00",liberty_ends:"2027-01-04T07:30:00",label:"NEW YEARS 96"}
];

const MSB_SECTIONS=["HQ","CSSC"];
const MEF_SECTIONS=["G1","G2","G3","G4","G6","G7","G8","CMST"]; // G5/SSEC added when toggled
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* Seed history (section allocations) so the fairness overlay works day one. */
const SEED_HISTORY=[
 {month:1,year:2026,label:"January 2026",days:[
  {date:14,day:"Wed",oodSection:"G4",holiday:""},{date:15,day:"Thu",oodSection:"G4",holiday:""},{date:16,day:"Fri",oodSection:"G3",holiday:"MLK DAY 96"},
  {date:17,day:"Sat",oodSection:"G2",holiday:""},{date:18,day:"Sun",oodSection:"CSSC",holiday:""},{date:19,day:"Mon",oodSection:"HQ",holiday:"MLK DAY 96"},
  {date:20,day:"Tue",oodSection:"HQ",holiday:""},{date:21,day:"Wed",oodSection:"G6",holiday:""},{date:22,day:"Thu",oodSection:"HQ",holiday:""},
  {date:23,day:"Fri",oodSection:"G1",holiday:""},{date:24,day:"Sat",oodSection:"G1",holiday:""},{date:25,day:"Sun",oodSection:"CMST",holiday:""},
  {date:26,day:"Mon",oodSection:"HQ",holiday:""},{date:27,day:"Tue",oodSection:"CSSC",holiday:""},{date:28,day:"Wed",oodSection:"G2",holiday:""},
  {date:29,day:"Thu",oodSection:"G6",holiday:""},{date:30,day:"Fri",oodSection:"G8",holiday:""},{date:31,day:"Sat",oodSection:"G3",holiday:""}]},
 {month:2,year:2026,label:"February 2026",days:[
  {date:13,day:"Fri",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:14,day:"Sat",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:15,day:"Sun",oodSection:"G3",holiday:"PRESIDENTS DAY 96"},
  {date:16,day:"Mon",oodSection:"HQ",holiday:"PRESIDENTS DAY 96"},{date:17,day:"Tue",oodSection:"HQ",holiday:""},{date:18,day:"Wed",oodSection:"G4",holiday:""},
  {date:19,day:"Thu",oodSection:"G6",holiday:""},{date:20,day:"Fri",oodSection:"HQ",holiday:""},{date:21,day:"Sat",oodSection:"G1",holiday:""},
  {date:22,day:"Sun",oodSection:"G4",holiday:""},{date:23,day:"Mon",oodSection:"CMST",holiday:""},{date:24,day:"Tue",oodSection:"G1",holiday:""},
  {date:25,day:"Wed",oodSection:"G2",holiday:""},{date:26,day:"Thu",oodSection:"G6",holiday:""},{date:27,day:"Fri",oodSection:"G8",holiday:""},{date:28,day:"Sat",oodSection:"G3",holiday:""}]},
 {month:3,year:2026,label:"March 2026",days:[
  {date:17,day:"Tue",oodSection:"G1",holiday:""},{date:18,day:"Wed",oodSection:"G3",holiday:""},{date:19,day:"Thu",oodSection:"G2",holiday:""},
  {date:20,day:"Fri",oodSection:"G4",holiday:""},{date:21,day:"Sat",oodSection:"G2",holiday:""},{date:22,day:"Sun",oodSection:"G4",holiday:""},
  {date:23,day:"Mon",oodSection:"G6",holiday:""},{date:24,day:"Tue",oodSection:"G8",holiday:""},{date:25,day:"Wed",oodSection:"CMST",holiday:""},
  {date:26,day:"Thu",oodSection:"G1",holiday:""},{date:27,day:"Fri",oodSection:"G6",holiday:""},{date:28,day:"Sat",oodSection:"G3",holiday:""},
  {date:29,day:"Sun",oodSection:"G8",holiday:""},{date:30,day:"Mon",oodSection:"HQ",holiday:""},{date:31,day:"Tue",oodSection:"G4",holiday:""}]},
 {month:5,year:2026,label:"May 2026",days:[
  {date:16,day:"Sat",oodSection:"G7",holiday:""},{date:17,day:"Sun",oodSection:"G1",holiday:""},{date:18,day:"Mon",oodSection:"G8",holiday:""},
  {date:19,day:"Tue",oodSection:"G2",holiday:""},{date:20,day:"Wed",oodSection:"G4",holiday:""},{date:21,day:"Thu",oodSection:"CMST",holiday:""},
  {date:22,day:"Fri",oodSection:"G2",holiday:"MEMORIAL DAY 96"},{date:23,day:"Sat",oodSection:"G6",holiday:""},{date:24,day:"Sun",oodSection:"G3",holiday:""},
  {date:25,day:"Mon",oodSection:"CMST",holiday:"MEMORIAL DAY 96"},{date:26,day:"Tue",oodSection:"G4",holiday:""},{date:27,day:"Wed",oodSection:"G6",holiday:""},
  {date:28,day:"Thu",oodSection:"G3",holiday:""},{date:29,day:"Fri",oodSection:"G7",holiday:""},{date:30,day:"Sat",oodSection:"G8",holiday:""}]}
];

/* Default eligible on-hand counts (illustrative — overwrite each month). */
const DEFAULT_ELIGIBLE={ HQ:8, CSSC:17, G1:4, G2:19, G3:16, G4:25, G5:0, G6:10, G7:73, G8:10, CMST:8 };

/* ---- CALENDAR -------------------------------------------------------------- */
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function parseLocal(s){ const [d,t='00:00:00']=s.split('T'); const [Y,M,D]=d.split('-').map(Number); const [h,mi,se]=t.split(':').map(Number);
  return new Date(Y,M-1,D,h||0,mi||0,se||0); }
function holidayLabelFor(y,m,date){ const s=new Date(y,m-1,date,0,0,0), e=new Date(y,m-1,date,23,59,59);
  for(const h of HOLIDAYS){ if(s<=parseLocal(h.liberty_ends)&&e>=parseLocal(h.liberty_starts)) return h.label; } return ''; }
function buildCalendar(y,m,mefCeStart){ const n=daysInMonth(y,m), days=[];
  for(let date=1;date<=n;date++){ const dow=new Date(y,m-1,date).getDay(), label=holidayLabelFor(y,m,date);
    days.push({date,dow,day:DAY_NAMES[dow],isWeekend:dow===0||dow===6,holiday:label,isHoliday:!!label}); }
  return {year:y,month:m,monthName:MONTH_NAMES[m-1],label:`${MONTH_NAMES[m-1]} ${y}`,mefCeStart,daysInMonth:n,days}; }

/* Which bucket owns a date: MSB owns 1..mefCeStart-1 and the 31st; MEF CE owns mefCeStart..30. */
function bucketOf(date,mefCeStart){ if(date===31) return 'MSB'; if(date<mefCeStart) return 'MSB'; if(date<=30) return 'MEF_CE'; return 'MSB'; }

/* ---- FAIRNESS (cross-month weekend/holiday overlay) ------------------------ */
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function blank(){ return {total:0,weekend:0,holiday:0}; }
function dWk(d){ return typeof d.isWeekend==='boolean'?d.isWeekend:(d.day==='Sat'||d.day==='Sun'); }
function dHol(d){ return !!(d.holiday&&String(d.holiday).trim()); }
function summarize(rosters){ const bySection={},byMonth={},ms=new Set();
  const ens=s=>{ if(!bySection[s]) bySection[s]={...blank(),byMonth:{}}; return bySection[s]; };
  for(const r of rosters){ const k=monthKey(r.year,r.month); ms.add(k); byMonth[k]=byMonth[k]||{};
    for(const d of r.days||[]){ const sec=d.oodSection||(d.ood&&d.ood.section); if(!sec) continue; const w=dWk(d),h=dHol(d),s=ens(sec);
      s.total++; if(w)s.weekend++; if(h)s.holiday++; s.byMonth[k]=s.byMonth[k]||blank(); s.byMonth[k].total++; if(w)s.byMonth[k].weekend++; if(h)s.byMonth[k].holiday++;
      byMonth[k][sec]=byMonth[k][sec]||blank(); byMonth[k][sec].total++; if(w)byMonth[k][sec].weekend++; if(h)byMonth[k][sec].holiday++; }}
  return {bySection,byMonth,months:[...ms].sort()}; }
function priorMonthKey(b,y,m){ const t=monthKey(y,m), e=b.months.filter(x=>x<t); return e.length?e[e.length-1]:null; }
function burdenForMonth(b,k,s){ return (b.byMonth[k]&&b.byMonth[k][s])||blank(); }
function recentBurden(b,s,bk,n=4){ const ks=b.months.filter(m=>!bk||m<=bk).slice(-n); let w=0,h=0,t=0;
  ks.forEach((k,i)=>{ const wt=i+1, st=(b.byMonth[k]&&b.byMonth[k][s])||blank(); w+=st.weekend*wt; h+=st.holiday*wt; t+=st.total*wt; }); return {weekend:w,holiday:h,total:t}; }
function scoreSection(section,day,b,target,state){ const pk=priorMonthKey(b,target.year,target.month), prev=pk?burdenForMonth(b,pk,section):blank(), rec=recentBurden(b,section,pk);
  const special=day.isWeekend||day.isHoliday; let sc=0; sc+=(state.assignedSpecial[section]||0)*0; // base balance handled by quota capacity
  if(special){ if(day.isHoliday&&prev.holiday>0) sc+=100; if(day.isWeekend&&prev.weekend>0) sc+=60; if(prev.weekend+prev.holiday>0) sc+=25;
    sc+=(state.assignedWeekend[section]||0)*40; sc+=(state.assignedHoliday[section]||0)*80; sc+=rec.holiday*6+rec.weekend*3; }
  return sc; }
function rankSections(secs,day,b,target,state){ return [...secs].map(s=>({section:s,score:scoreSection(s,day,b,target,state)}))
  .sort((a,b2)=>a.score-b2.score||a.section.localeCompare(b2.section)); }
function gradeRoster(g,b){ const pk=priorMonthKey(b,g.year,g.month),flags=[]; let pen=0; const tm={};
  for(const d of g.days){ const sec=d.ood&&d.ood.section; if(!sec) continue; tm[sec]=tm[sec]||blank(); tm[sec].total++; if(d.isWeekend)tm[sec].weekend++; if(d.isHoliday)tm[sec].holiday++; }
  for(const [sec,st] of Object.entries(tm)){ const prev=pk?burdenForMonth(b,pk,sec):blank();
    if(st.holiday>0&&prev.holiday>0){ pen+=20; flags.push({level:'red',msg:`${sec} carried holiday duty two months in a row.`}); }
    else if(st.weekend>0&&prev.weekend>0){ pen+=10; flags.push({level:'yellow',msg:`${sec} carried weekend duty two months in a row.`}); } }
  const score=Math.max(0,100-pen), grade=score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F'; return {score,grade,flags,thisMonth:tm}; }
function owedLighterMonths(b,target){ const pk=priorMonthKey(b,target.year,target.month),out=[];
  for(const sec of Object.keys(b.bySection)){ const prev=pk?burdenForMonth(b,pk,sec):blank();
    if(prev.holiday>0) out.push({section:sec,reason:'carried holiday last month',level:'red'});
    else if(prev.weekend>0) out.push({section:sec,reason:'carried weekend last month',level:'yellow'}); } return out; }

/* ---- PROPORTIONAL QUOTAS (largest-remainder) ------------------------------- */
function largestRemainder(weights,total){
  const keys=Object.keys(weights); const sum=keys.reduce((a,k)=>a+(weights[k]||0),0); const q={}; keys.forEach(k=>q[k]=0);
  if(total<=0) return q;
  if(sum<=0){ for(let i=0;i<total;i++) q[keys[i%keys.length]]++; return q; } // no data -> even round-robin
  const rem=[]; let used=0;
  keys.forEach(k=>{ const raw=(weights[k]||0)/sum*total, f=Math.floor(raw); q[k]=f; used+=f; rem.push([k,raw-f]); });
  let left=total-used; rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;i<left;i++) q[rem[i%rem.length][0]]++;
  return q;
}

/* ---- ALLOCATION ENGINE ----------------------------------------------------- */
function allocateBucketDays(bucketDays,sections,quota,burden,target){
  const cap={}; sections.forEach(s=>cap[s]=quota[s]||0);
  const state={assignedSpecial:{},assignedWeekend:{},assignedHoliday:{}};
  const ordered=[...bucketDays].sort((a,b)=>{ const r=x=>x.isHoliday?0:x.isWeekend?1:2; return r(a)-r(b)||a.date-b.date; });
  const out={};
  for(const day of ordered){ const avail=sections.filter(s=>cap[s]>0); if(!avail.length){ out[day.date]=''; continue; }
    const sec=rankSections(avail,day,burden,target,state)[0].section; out[day.date]=sec; cap[sec]--;
    if(day.isWeekend)state.assignedWeekend[sec]=(state.assignedWeekend[sec]||0)+1;
    if(day.isHoliday)state.assignedHoliday[sec]=(state.assignedHoliday[sec]||0)+1; }
  return out;
}
function allocateRoster(cal,eligible,cfg,burden){
  const mefCeStart=cfg.mefCeStart;
  const msbDays=[],mefDays=[];
  for(const d of cal.days){ (bucketOf(d.date,mefCeStart)==='MSB'?msbDays:mefDays).push(d); }
  // MSB quota (HQ vs CSSC)
  const msbW={HQ:eligible.HQ||0,CSSC:eligible.CSSC||0};
  const msbQuota=largestRemainder(msbW,msbDays.length);
  // MEF CE quota (by section)
  const mefSecs=MEF_SECTIONS.slice(); if(cfg.includeG5) mefSecs.push('G5');
  const mefW={}; mefSecs.forEach(s=>mefW[s]=eligible[s]||0);
  const mefQuota=largestRemainder(mefW,mefDays.length);
  const target={year:cal.year,month:cal.month};
  const msbAssign=allocateBucketDays(msbDays,['HQ','CSSC'].filter(s=>msbQuota[s]>0||(msbW[s]>0)),msbQuota,burden,target);
  const mefActive=mefSecs.filter(s=>mefQuota[s]>0);
  const mefAssign=allocateBucketDays(mefDays,mefActive,mefQuota,burden,target);
  // build day rows; AOOD = HQ/CSSC support, cross-company preference
  const aoodCount={HQ:0,CSSC:0};
  const days=cal.days.map(d=>{
    const isMsb=bucketOf(d.date,mefCeStart)==='MSB';
    const sec=isMsb?(msbAssign[d.date]||''):(mefAssign[d.date]||'');
    const oodCo=(sec==='HQ'||sec==='CSSC')?sec:'MEF_CE';
    let aSec; const opp=oodCo==='HQ'?'CSSC':oodCo==='CSSC'?'HQ':null;
    if(opp) aSec=opp; else aSec=(aoodCount.CSSC<=aoodCount.HQ)?'CSSC':'HQ';
    aoodCount[aSec]++;
    return {date:d.date,day:d.day,dow:d.dow,isWeekend:d.isWeekend,isHoliday:d.isHoliday,holiday:d.holiday,
      pool:isMsb?'MSB':'MEF_CE', ood:{name:'',section:sec,phone:''}, aood:{name:'',section:aSec,phone:''}};
  });

const HEADERS=['DATE','DAY','OOD','SECTION','OOD#','AOOD','SECTION','AOOD#','Holiday']; const COLW=[6,12,32,10,16,32,10,16,18];
async function exportXlsx(roster){
  if(typeof ExcelJS==='undefined'){ toast('Excel library not loaded — exporting CSV instead.'); return exportCsv(roster); }
  const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet(`${roster.monthName} ${roster.year}`,{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=COLW.map(w=>({width:w}));
  const bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  const st=(row,font,fill)=>row.eachCell({includeEmpty:true},c=>{ c.font=font||{name:'Calibri',size:8,bold:true};
    c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=bd; if(fill)c.fill=fill; });
  ws.mergeCells(1,1,1,HEADERS.length); const t=ws.getCell(1,1);
  t.value=`MEF & MSB Duty Roster for ${roster.monthName} ${roster.year}. P.O.C for NO SHOWS is the HQ Co 1stLt Joseph, James`;
  t.font={name:'Calibri',size:11,bold:true}; t.alignment={horizontal:'center',vertical:'middle',wrapText:true}; t.border=bd; ws.getRow(1).height=30;
  const hr=ws.getRow(2); HEADERS.forEach((h,i)=>hr.getCell(i+1).value=h); st(hr,{name:'Calibri',size:10,bold:true});
  const yel={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}},amb={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC000'}},blk={type:'pattern',pattern:'solid',fgColor:{argb:'FF000000'}};
  let r=3;
  for(const d of roster.days){ const row=ws.getRow(r);
    row.getCell(1).value=d.date; row.getCell(2).value=d.day;
    row.getCell(3).value=(d.ood&&d.ood.name)||''; row.getCell(4).value=(d.ood&&d.ood.section)||''; row.getCell(5).value=(d.ood&&d.ood.phone)||'';
    row.getCell(6).value=(d.aood&&d.aood.name)||''; row.getCell(7).value=(d.aood&&d.aood.section)||''; row.getCell(8).value=(d.aood&&d.aood.phone)||'';
    row.getCell(9).value=d.holiday||''; st(row,null,d.isHoliday?amb:d.isWeekend?yel:null); r++; }
  const sf={name:'Calibri',size:8,bold:true,color:{argb:'FFFFFFFF'}};
  for(const s of roster.supernumerary||[]){ const row=ws.getRow(r); row.getCell(1).value=s.element; row.getCell(2).value='SUPERNUMERARY';
    row.getCell(4).value=s.section||''; st(row,sf,blk); r++; }
  const tr=ws.getRow(r); tr.getCell(1).value='TOTAL'; tr.getCell(2).value=`${roster.days.length} days`; st(tr);
  const buf=await wb.xlsx.writeBuffer();
  download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`${roster.monthName}_${roster.year}_OOD_AOOD_Duty_Roster.xlsx`);
  toast('Excel file downloaded.');
}
function exportCsv(roster){ const q=v=>{ v=v==null?'':String(v); return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  let rows=[HEADERS.join(',')];
  for(const d of roster.days) rows.push([d.date,d.day,'',d.ood&&d.ood.section,'','',d.aood&&d.aood.section,'',q(d.holiday)].join(','));
  for(const s of roster.supernumerary||[]) rows.push([s.element,'SUPERNUMERARY','','','','','','',''].join(','));
  download(new Blob([rows.join('\n')],{type:'text/csv'}),`${roster.monthName}_${roster.year}_OOD_AOOD_Duty_Roster.csv`); toast('CSV downloaded.'); }

/* ---- PARSE UPLOADED ROSTER (.xlsx) for history ----------------------------- */
function normalizeSection(s){ if(!s) return ''; const u=String(s).trim().toUpperCase(); return ({'COMMSTRAT':'CMST','CMST/COMMSTRAT':'CMST'})[u]||u; }
function monthYearFromName(name){ const l=name.toLowerCase(); let month=null; MONTH_NAMES.forEach((m,i)=>{ if(l.includes(m.toLowerCase())) month=i+1; });
  const y=l.match(/(20\d{2})/); return {month,year:y?Number(y[1]):null}; }
function cellText(c){ if(!c) return ''; const v=c.value; if(v==null) return ''; if(typeof v==='object'){ if(v.text) return String(v.text).trim();
  if(v.result!=null) return String(v.result).trim(); if(v.richText) return v.richText.map(t=>t.text).join('').trim(); return ''; } return String(v).trim(); }
async function parseRosterFile(file){ if(typeof ExcelJS==='undefined') throw new Error('Excel reader unavailable on this network.');
  const buf=await file.arrayBuffer(), wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf); const ws=wb.worksheets[0]; let hr=2;
  ws.eachRow((row,n)=>{ const vals=row.values.map(c=>String(c||'').toUpperCase()); if(vals.some(v=>v.includes('DATE'))&&vals.some(v=>v.includes('OOD'))&&hr===2) hr=n; });
  const col={}; ws.getRow(hr).eachCell((c,i)=>{ const tt=cellText(c).toUpperCase().replace(/\s+/g,'');
    if(tt==='DATE')col.date=i; else if(tt==='DAY')col.day=i; else if(tt.includes('HOLIDAY'))col.holiday=i;
    else if(tt.includes('AOOD#'))col.aoodPhone=i; else if(tt.includes('OOD#'))col.oodPhone=i;
    else if(tt==='AOOD'&&col.aood==null)col.aood=i; else if(tt==='OOD'&&col.ood==null)col.ood=i;
    else if(tt==='SECTION'){ if(col.oodSection==null)col.oodSection=i; else col.aoodSection=i; } });
  const at=(row,c)=>c?cellText(row.getCell(c)):''; const {month,year}=monthYearFromName(file.name); const days=[];
  for(let r=hr+1;r<=ws.rowCount;r++){ const row=ws.getRow(r), draw=at(row,col.date||1), date=parseInt(draw,10), oodSection=normalizeSection(at(row,col.oodSection));
    if(/SUPERNUMERARY|TOTAL/i.test(draw)||/SUPERNUMERARY/i.test(oodSection)) continue; if(!Number.isFinite(date)) continue;
    days.push({date,day:at(row,col.day),oodSection,holiday:at(row,col.holiday)}); }
  return {month,year,label:(month&&year)?`${MONTH_NAMES[month-1]} ${year}`:file.name,days}; }

        <li><b>Overlay:</b> weekends/holidays are then steered so no section carries them in back-to-back months when avoidable — without breaking the proportional totals.</li>
      </ul>
      <p class="small muted">Policy language: "Monthly duty allocations will be apportioned based on each organization's on-hand strength of eligible duty standers (present for duty ≥5 days that month). I MEF CE allocations are determined as a single pool, then subdivided proportionally among directorates by each section's eligible on-hand strength. Final adjustments may distribute weekends/holidays more equitably, provided allocations remain substantially proportional."</p>
    </div>
    <div class="card"><h2>Saving your work</h2>
      <p>Your eligible counts and history save automatically in this browser. Use <b>💾 Save Data</b> (top bar) to export a <code>duty_allocation_data.json</code> you can carry to another computer and restore with <b>📂 Load Data</b>. Nothing is uploaded anywhere — this file runs entirely on your machine.</p>
      <div class="small muted">POC: 1stLt Joseph, James L. — HQ Co XO / S-6, I MSB.</div></div>`;
}

function render(){ renderNav();
  for(const [id] of TABS) document.getElementById('tab-'+id).classList.add('hide');
  document.getElementById('tab-'+state.tab).classList.remove('hide');

loadState(); render();
